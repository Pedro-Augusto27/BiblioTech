<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Minha Prateleira - Biblioteca Conect</title>
</head>

<body>
    <header class="main-header">
        <div class="header-content">
            <h1>📖 Biblioteca Conect</h1>
            <nav class="nav-menu">
                <a href="../index.html" class="active">Login</a>
                <!-- <a href="./src/pages/bibliotecaria.html">Painel Admin</a> -->
                <a href="./prateleira.html">Minha Prateleira</a>
            </nav>
        </div>
    </header>

    
    <main style="max-width: 1000px; margin: 0 auto; padding: 20px;">

        <div class="container" style="margin-bottom: 20px; text-align: center;">
            <h2 id="saudacaoLeitor">Bem-vindo, Leitor!</h2>
            <p>Aqui você pode ver os seus livros alugados e o prazo de devolução.</p>
        </div>

        <div class="container" style="margin-bottom: 20px;">
            <h3 style="border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 12px;">🔎 Buscar Livro e Solicitar Empréstimo</h3>

            <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:10px;">
                <input id="inputLivroPrat" type="text" placeholder="Digite o título do livro..." style="width:100%; padding:14px; font-size:16px; border:2px solid #cbd5e1; border-radius:6px;" />
                <button onclick="buscarLivroAPIPrateleira()" style="padding:10px 14px; width:160px; align-self:flex-start; background-color:#007bff; color:#fff; border:none; border-radius:6px;">Pesquisar</button>
            </div>

            <div id="feedbackBuscaPrat" style="margin-bottom:10px; color:#555;font-weight:600;"></div>

            <div id="resultadoLivroPrat" style="display:none; padding:16px; border:1px solid #ddd; border-radius:8px; text-align:center;">
                <img id="livroCapaPrat" src="" alt="Capa" style="max-height:220px; display:block; margin:0 auto 12px;">
                <h3 id="livroTituloPrat" style="margin:6px 0; font-size:18px;"></h3>
                <p id="livroAutorPrat" style="color:#444; margin:4px 0 12px 0; font-size:15px;"></p>
                <button onclick="solicitarEmprestimoPrateleira()" style="background-color:#0056b3; color:#fff; padding:10px 14px; border-radius:6px;">Solicitar Empréstimo</button>
            </div>
        </div>

        <div class="container">
            <h3 style="border-bottom: 2px solid #0056b3; padding-bottom: 10px; margin-bottom: 20px;">
                📖 Meus Livros Emprestados
            </h3>

            <div id="meusLivrosCards"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="logoutCliente()" style="background-color: #ff0000; padding: 10px 30px;">Fazer Logout /
                Sair</button>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 Biblioteca Conect. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="../scripts/script.js"></script>
</body>

</html>
